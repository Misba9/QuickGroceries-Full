org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# Gradle 8.x / Android Gradle Plugin require JDK 17–21. JDK 25 fails with error "25.0.2".
# Install: brew install openjdk@17
# If this path differs on your machine, run: /usr/libexec/java_home -v 17
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

android.useAndroidX=true
# Keep Jetifier for legacy transitive deps (e.g. older SDKs pulled by some payment plugins).
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
